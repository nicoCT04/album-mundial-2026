name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar config.js desde secrets
        run: |
          cat > config.js << EOF
          const CONFIG = {
            firebase: ${{ secrets.FIREBASE_CONFIG }},
            pin: "${{ secrets.APP_PIN }}"
          };
          EOF

      - name: Deploy a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.gitignore,README.md,.github'